name: .NET Build MonoGame

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest  # MonoGame требует Windows для сборки контента
    
    strategy:
      matrix:
        configuration: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x  # или 6.0.x / 7.0.x в зависимости от проекта
    
    - name: Install MonoGame templates
      run: dotnet new install MonoGame.Templates.CSharp
    
    - name: Install dotnet-mgcb tool
      run: dotnet tool install --global dotnet-mgcb
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Content Pipeline
      run: |
        if (Test-Path "Content/Content.mgcb") {
          mgcb Content/Content.mgcb --build
        } elseif (Test-Path "Content.mgcb") {
          mgcb Content.mgcb --build
        }
      shell: pwsh
    
    - name: Build project
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore
    
    - name: Run tests (если есть)
      run: dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal
      continue-on-error: true  # если тестов нет, не ломает сборку
    
    - name: Upload build artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: AlchemyWizard-${{ matrix.configuration }}-windows
        path: |
          bin/${{ matrix.configuration }}/net*/win-*/
          bin/${{ matrix.configuration }}/net*/*.exe
          bin/${{ matrix.configuration }}/net*/*.dll
          bin/${{ matrix.configuration }}/net*/Content/
        retention-days: 7
